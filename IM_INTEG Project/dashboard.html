<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/dashboard.css">
    <title>Dashboard</title>
</head>
<body>
   <div class="container">
    <!-- Aside Start -->
        <aside>
            <!-- top start -->
        <div class="top">
            <div class="logo">
                <h2>DOr<span class = "primary">SU</span></h2>
            </div>
        </div>
        <div class="profile">
            <div class="info">
                <p><b>Phil</b></p>
                <small class="text-muted"></small>
            </div>
            <div class="profile-photo">
                <img src="assets/images/profile.jpg" alt="" srcset="">
            </div>
        </div>
        <!-- top end -->
        <!-- navigation -->
        <div class="sidebar" id="nav-menu">
                <ul class="nav-list">
                    <li>
                    <a href="#" class="nav_link">
                        <h3>DashBoard</h3>
                    </a>
                    </li>
                    <li>
                        <a href="enroll.html" class="nav_link">
                            <h3>Insert Records</h3>
                        </a>
                    </li>
                    <li>
                        <a href="manageinstructors.html" class="nav_link">
                            <h3>Edit Records</h3>
                        </a>
                    </li>
                    <li>
                        <a href="manageinstructors.html" class="nav_link">
                            <h3>Delete Records</h3>
                        </a>
                    </li>
                    <li>
                        <a href="changePassword.html" class="nav_link">
                            <h3>Change Password</h3>
                        </a>
                    </li>
                    <li>
                        <a href="index.html" class="nav-link">
                            <h3>Logout</h3>
                        </a>
                    </li>                    
                </ul>
        </div>
        <!-- end of navigation -->
        </aside>
    <!-- Aside End -->
    <main>
        <h1>Dashboard</h1>
        <!-- Start Insights -->
        <div class="insights">

        <!-- Start TotalStudents -->
        <div class="total-students">
            <div class="middle">
                <div class="left">
                    <h3>Total Products</h3>
                    <h1>2,400</h1>
                </div>
                <div class="progress">
                    <svg>
                        <circle r="30" cy="40" cx="40"></circle>
                    </svg>
                    <div class="number">+156</div>
                </div>   
            </div>
        </div>
        <!-- end TotalStudents -->

        <!-- Start Faculty -->
        <div class="faculty">
            <div class="middle">
                <div class="left">
                    <h3>Total Sales</h3>
                    <h1>489</h1>
                </div>
                <div class="progress">
                    <svg>
                        <circle r="30" cy="40" cx="40"></circle>
                    </svg>
                    <div class="number">+2</div>
                </div>   
            </div>
        </div>
        <!-- end Faculty -->

        <!-- Start ActiveStudents -->
        <div class="active-students">
            <div class="middle">
                <div class="left">
                    <h3>Active Customer</h3>
                    <h1>2389</h1>
                </div>
                <div class="progress">
                    <svg>
                        <circle r="30" cy="40" cx="40"></circle>
                    </svg>
                    <div class="number">+152</div>
                </div>   
            </div>
        </div>
        <!-- end ActiveStudents -->
        </div>
        <!-- End Insights -->

        <!-- Start Display -->
        <div class="display">
            <h1>Products</h1>
            <table>
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Product Name</th>
                        <th>Product Price</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <!-- End Display -->
    </main>
   </div>
</body>
</html>
