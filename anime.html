<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Anime GIF</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 20px;
      background: #2c2c3a;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .container h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .gif-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gif-container img {
      max-width: 100%;
      border-radius: 10px;
    }

    .refresh-btn {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #7c4dff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .refresh-btn:hover {
      background-color: #651fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Random Anime GIF</h1>
    <div class="gif-container" id="gifContainer">
      <img src="" alt="Anime GIF" id="animeGif" />
    </div>
    <button class="refresh-btn" onclick="loadGif()">Get New GIF</button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    function loadGif() {
      var settings = {
        "url": "https://any-anime.p.rapidapi.com/v1/anime/gif/1",
        "method": "GET",
        "timeout": 0,
        "headers": {
          "x-rapidapi-key": "90af73cb4emshdf71b86a82d1a62p134453jsn3d12d63bd176",
          "x-rapidapi-host": "any-anime.p.rapidapi.com"
        },
      };

      $.ajax(settings).done(function (response) {
        console.log(response);
        if (response && response.images && response.images.length > 0) {
          $('#animeGif').attr('src', response.images[0]);
        }
      });
    }

    // Load initial GIF on page load
    $(document).ready(function () {
      loadGif();
    });
  </script>
</body>
</html>
